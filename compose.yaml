services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora_user
      POSTGRES_PASSWORD: nexora_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - db

volumes:
  postgres_data: